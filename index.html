<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3GFlora Catalogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--ink:#f2f2f2;--mute:#9a9a9a;--line:#2a2a2a;--dot:rgba(255,255,255,.6);--dot-on:#fff;--navbg:rgba(20,20,20,.85);--navink:#f2f2f2;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Jost',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:300}
header{text-align:center;padding:36px 16px 28px}
header h1{margin:0;font-weight:300;font-size:22px;letter-spacing:.42em;padding-left:.42em}
main{max-width:520px;margin:0 auto;padding:0 0 56px}
.card{margin:0 0 44px}
.media{position:relative}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;outline-offset:-2px}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:1/1;background:var(--line)}
.slide img{display:block;width:100%;height:100%;object-fit:cover}
.dots{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:6px;pointer-events:none}
.dot{width:6px;height:6px;border-radius:50%;background:var(--dot);transition:background .2s,transform .2s}
.dot.on{background:var(--dot-on);transform:scale(1.25)}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:50%;background:var(--navbg);color:var(--navink);font-size:24px;line-height:1;cursor:pointer;display:none;align-items:center;justify-content:center;padding:0 0 3px}
.prev{left:10px}.next{right:10px}
@media (hover:hover) and (pointer:fine){.nav{display:flex}.nav[hidden]{display:none}}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:16px 16px 0}
.meta h2{margin:0;font-size:18px;font-weight:400;letter-spacing:.01em}
.meta p{margin:0;font-size:18px;font-weight:500;white-space:nowrap}
.meta s{font-weight:300;color:var(--mute);margin-right:10px;font-size:15px}
